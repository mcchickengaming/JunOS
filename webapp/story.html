<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The story</title>
<!-- A place in the story (#34): the game world opens this page in its frame when a place on the map has
     go: { story: <spot> } (js/game-world.js startStory → story.html?at=<spot>). It asks the story-event engine
     what happens here, shows it (js/story-view.js) and offers what you can do in this place. Stand-in look on
     purpose. Her pages allow no inline scripts: the script is js/story-page.js. -->
<style>
  :root { --bg: #0f0e1c; --ink: #fff; --muted: #b9b4d6; --edge: #2e2a4f; --accent: #ec0054; --card: #19172e;
    --sv-box: #19172e; --sv-edge: #2e2a4f; --sv-dim: #b9b4d6; --sv-accent: #ff7aa2; --sv-her: #7ac8ff; --sv-ink: #fff; --sv-btn: #231f3d; --sv-card: #ffd76a; --sv-cardbg: #221c12; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 Arial, Helvetica, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 22px 18px 60px; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .when { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
  .here { margin-top: 16px; border-top: 1px solid var(--edge); padding-top: 12px; }
  .here h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
  .note { color: var(--muted); font-size: 12.5px; min-height: 1.3em; margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="place">…</h1>
  <div class="when" id="when"></div>
  <div id="scene" aria-live="polite"></div>
  <div class="here" id="here" hidden>
    <div id="todo"></div>
  </div>
  <p class="note" id="note" role="status"></p>
</main>
<script type="module" src="js/story-page.js?v=5"></script>
</body>
</html>
