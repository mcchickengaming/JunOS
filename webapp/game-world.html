<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The game world</title>
<!-- The game world (Nov 15, the settings split): her window shows plain Jun; "Enter the game world" opens this page
     over it (index.html, #gameWorld). Inside, the window is only the game. Its own menu (Esc) is the game's settings:
     desktop-settings.html?embed=game (difficulty, fights and delves, skills, game saves, what you own), and those ride
     in the game saves. Stand-in look on purpose: the plumbing first, the owner's concept art later. -->
<style>
  :root { --bg: #0f0e1c; --ink: #fff; --muted: #b9b4d6; --edge: #2e2a4f; --accent: #ec0054; --card: #19172e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 Arial, Helvetica, sans-serif; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--edge); }
  .bar h1 { flex: 1; margin: 0; font-size: 15px; letter-spacing: .04em; }
  .btn { background: var(--card); color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit; }
  .btn:hover { border-color: var(--accent); }
  .btn.accent { background: var(--accent); border-color: var(--accent); }
  .world { height: calc(100% - 52px); position: relative; }
  .hub { padding: 28px; max-width: 760px; margin: 0 auto; }
  .hub p { color: var(--muted); }
  .places { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 18px; }
  .place { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 14px; text-align: left; color: var(--ink); font: inherit; }
  .place b { display: block; margin-bottom: 4px; }
  .place span { color: var(--muted); font-size: 12.5px; }
  .note { color: var(--muted); min-height: 1.4em; }
  .place[disabled] { opacity: .45; cursor: default; }
  .place:not([disabled]) { cursor: pointer; }
  .place:not([disabled]):hover { border-color: var(--accent); }
  iframe.play { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .menu { position: fixed; inset: 0; background: rgba(5, 4, 14, .72); display: flex; align-items: stretch; justify-content: center; padding: 28px; }
  .menu[hidden] { display: none; }
  .menu .sheet { width: min(860px, 100%); background: var(--bg); border: 1px solid var(--edge); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
  .menu .sheet .bar { border-bottom: 1px solid var(--edge); }
  .menu iframe { flex: 1; border: 0; width: 100%; background: var(--bg); }
</style>
</head>
<body>
<div class="bar">
  <button type="button" class="btn" id="back" title="Back to her">← Back to her</button>
  <h1 id="title">The game world</h1>
  <button type="button" class="btn" id="hubBtn" hidden>Back to the map</button>
  <button type="button" class="btn" id="momentsBtn" title="The moments you've stayed in, to look at again">Moments</button>
  <button type="button" class="btn" id="menuBtn" title="The game's menu (Esc)">Menu</button>
</div>
<div class="world">
  <div class="hub" id="hub">
    <h2>Cache</h2>
    <p>Stand-in map. Places come from data/places.json: the story opens them as you go.</p>
    <div class="places" id="places" aria-label="Places"></div>
    <p class="note" id="placeNote" role="status"></p>
  </div>
</div>
<div class="menu" id="menu" hidden>
  <div class="sheet">
    <div class="bar"><h1>Menu</h1><button type="button" class="btn" id="menuClose">Back to the game (Esc)</button></div>
    <iframe id="menuFrame" title="The game's menu"></iframe>
  </div>
</div>
<script type="module" src="js/game-world.js?v=4"></script>
</body>
</html>
