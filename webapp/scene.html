<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moments together</title>
<!-- Moments together (#22): the album of the scenes you've been in, inside the game world (game-world.html's
     "Moments" button). Each scene keeps the parts you reached, with a line from her about each, and can be played
     again; playing one again changes nothing (no memory, no save). What you've reached lives in the game's story
     state, so every game save carries its own album. Stand-in look on purpose; later this is a page of her
     scrapbook. Her pages allow no inline scripts: the script is js/scene-page.js. -->
<style>
  :root { --bg: #0f0e1c; --ink: #fff; --muted: #b9b4d6; --edge: #2e2a4f; --accent: #ec0054; --card: #19172e;
    --sv-box: #19172e; --sv-edge: #2e2a4f; --sv-dim: #b9b4d6; --sv-accent: #ff7aa2; --sv-her: #7ac8ff; --sv-ink: #fff; --sv-btn: #231f3d; --sv-card: #ffd76a; --sv-cardbg: #221c12; --sc-stage: #141126; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 Arial, Helvetica, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 22px 18px 60px; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .note { color: var(--muted); font-size: 12.5px; min-height: 1.3em; margin: 4px 0 14px; }
  .moment { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .moment h2 { font-size: 15px; margin: 0; }
  .moment ul { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 4px; }
  .moment li b { font-weight: 600; }
  .moment li span { color: var(--muted); }
  .moment li.no { color: var(--muted); }
  button { background: var(--sv-btn); color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Moments together</h1>
  <p class="note" id="note" role="status">…</p>
  <div id="list"></div>
  <div id="play" hidden></div>
</main>
<script type="module" src="js/scene-page.js?v=4"></script>
</body>
</html>
