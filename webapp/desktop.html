<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jun</title>
<link rel="icon" type="image/png" href="jun_os.png">
<!-- the desktop app's frameless modes (desktop/main.js): compact,
     and stepout where she stands on the taskbar. inline styles on
     purpose, this page is never cached -->
<style>
  /* every color is a variable: Jun menu > Customize colors (desktop-settings.html)
     writes them, js/desktop.js applies them live */
  :root { --panel: #191233; --field: #241c46; --accent: #ec0054; --ink: #ffffff; --muted: #a79fc9;
    --card: #191233; --card-name: #15142e; --bubble: #191233; --bubble-edge: #ec0054; --glow: #ec0054; --shadow-alpha: .42;
    /* see-through: how solid each background is (0 = gone, 1 = solid), and an outline
       on the text so it reads over anything once the backgrounds are gone */
    --panel-a: 1; --card-a: 1; --bubble-a: 1; --edge-a: 1; --outline: none;
    --panel-bg: color-mix(in srgb, var(--panel) calc(var(--panel-a) * 100%), transparent);
    --field-bg: color-mix(in srgb, var(--field) calc(var(--panel-a) * 100%), transparent);
    --card-bg: color-mix(in srgb, var(--card) calc(var(--card-a) * 100%), transparent);
    --card-name-bg: color-mix(in srgb, var(--card-name) calc(var(--card-a) * 100%), transparent);
    --bubble-bg: color-mix(in srgb, var(--bubble) calc(var(--bubble-a) * 100%), transparent);
    --edge: color-mix(in srgb, var(--bubble-edge) calc(var(--edge-a) * 100%), transparent);
    --accent-edge: color-mix(in srgb, var(--accent) calc(var(--edge-a) * 100%), transparent); }
  /* "fade the chat bar": see-through until the mouse is on it or you're typing */
  html.fade-chat .talk { opacity: .3; transition: opacity .3s ease; }
  html.fade-chat .talk:hover, html.fade-chat .talk:focus-within, html.fade-chat .talk.thinking { opacity: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none;
    font-family: Arial, Helvetica, sans-serif; color: var(--ink); }
  #stage { position: absolute; left: 0; right: 0; top: 110px; bottom: 0; }
  html.mode-compact #stage { top: 0; bottom: 58px; }
  #stage canvas { display: block; }
  /* her speech card (core/speech-card.js) sizes itself off her width, which is
     tiny in a window this small. fixed size here so the words stay readable */
  .wardrobe-reaction { --wr-w: 230px !important; --wr-scale: .8 !important; color: var(--ink) !important; text-shadow: var(--outline); }
  .wardrobe-reaction-name { background: var(--card-name-bg) !important; border-left-color: var(--accent-edge) !important; }
  .wardrobe-reaction-text { background: var(--card-bg) !important; }

  .talk { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); width: min(340px, calc(100% - 24px)); z-index: 6; }
  html.mode-compact .talk { top: auto; bottom: 10px; }
  .talk[hidden] { display: none; }
  .talk form { display: flex; gap: 6px; padding: 6px; background: var(--panel-bg); border-left: 5px solid var(--accent-edge);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    box-shadow: 0 4px 18px rgba(0, 0, 0, calc(.35 * var(--panel-a))); }
  .talk input { flex: 1; min-width: 0; border: 0; outline: 0; padding: 7px 8px; font: 600 14px Arial, Helvetica, sans-serif;
    color: var(--ink); background: var(--field-bg); text-shadow: var(--outline); }
  .talk input::placeholder { color: var(--muted); }
  .talk button { border: 0; padding: 0 12px; font: 800 13px Arial, Helvetica, sans-serif; color: var(--ink); background: var(--accent); cursor: pointer; }
  .talk.thinking button[type=submit] { opacity: .5; }
  /* drag the grip to move the bar, the x hides it. tap her to bring it back */
  .talk .grip { width: 14px; padding: 0; cursor: grab; touch-action: none; background:
    radial-gradient(circle, var(--muted) 1.2px, transparent 1.6px) 0 0 / 7px 7px; opacity: .8; }
  .talk .grip:active { cursor: grabbing; }
  .talk .close { padding: 0 9px; background: transparent; color: var(--muted); font-size: 16px; }
  .talk .close:hover { color: var(--ink); background: var(--field); }
  .talk.moved { transform: none; }
  .talk.thinking input::placeholder { color: var(--accent); }

  .tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 7; opacity: 0; transition: opacity .2s; }
  html.mode-compact body:hover .tools { opacity: 1; }
  html.mode-stepout .tools { display: none; }
  .tools button { width: 28px; height: 28px; border: 0; color: var(--ink); background: color-mix(in srgb, var(--panel) 80%, transparent); cursor: pointer; font: 800 14px Arial, Helvetica, sans-serif; }
  .tools button:hover { background: var(--accent); }

  .note { position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 8; padding: 10px 12px; font: 700 14px/1.3 Arial, Helvetica, sans-serif;
    background: var(--panel-bg); border-left: 5px solid var(--accent-edge); }
  .note[hidden] { display: none; }
  .note button { margin-top: 8px; border: 0; padding: 6px 10px; font: 800 13px Arial, Helvetica, sans-serif; color: var(--ink); background: var(--accent); cursor: pointer; }

  .zzz { position: absolute; left: 58%; top: 34%; z-index: 5; pointer-events: none; font: 800 20px Arial, Helvetica, sans-serif;
    color: var(--ink); text-shadow: 0 0 6px var(--accent), 0 1px 2px #000; }
  .zzz[hidden] { display: none; }
  .zzz span { position: absolute; opacity: 0; animation: zzz 3.6s ease-in-out infinite; }
  .zzz span:nth-child(2) { animation-delay: 1.2s; font-size: 16px; }
  .zzz span:nth-child(3) { animation-delay: 2.4s; font-size: 24px; }
  /* her shadow on the taskbar. placed at her feet by js/desktop.js */
  .shadow { position: absolute; z-index: 0; pointer-events: none; height: 14px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0, 0, 0, var(--shadow-alpha)), rgba(0, 0, 0, calc(var(--shadow-alpha) * .45)) 60%, transparent);
    transform: translate(-50%, -50%) scale(1); transition: transform .25s ease, opacity .25s ease; }
  .shadow.lifted { transform: translate(-50%, -50%) scale(.35); opacity: 0; }
  .shadow[hidden] { display: none; }

  /* the little thought icon over her head: ♪ ? ! ♥ … */
  .emote { position: absolute; z-index: 5; pointer-events: none; min-width: 30px; height: 30px; padding: 0 6px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; font: 800 18px Arial, Helvetica, sans-serif; color: var(--ink); text-shadow: var(--outline);
    background: var(--bubble-bg); border: 2px solid var(--edge); border-radius: 15px; transform: translate(-50%, -100%) scale(0); opacity: 0; }
  .emote::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; background: var(--bubble-bg);
    border-right: 2px solid var(--edge); border-bottom: 2px solid var(--edge); transform: translateX(-50%) rotate(45deg); }
  .emote.show { animation: emote-pop 1.9s ease forwards; }
  @keyframes emote-pop {
    0% { opacity: 0; transform: translate(-50%, -80%) scale(0); }
    12% { opacity: 1; transform: translate(-50%, -105%) scale(1.15); }
    20% { transform: translate(-50%, -100%) scale(1); }
    80% { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -120%) scale(.9); }
  }

  /* stepping out of her window, and climbing back in */
  #stage.enter { animation: jun-enter .7s cubic-bezier(.2, .9, .3, 1.3) both; }
  @keyframes jun-enter {
    0% { transform: translateY(30%) scale(.4); opacity: 0; }
    55% { transform: translateY(-8%) scale(1.04); opacity: 1; }
    100% { transform: none; opacity: 1; }
  }
  #stage.leave { animation: jun-leave .5s ease-in both; }
  @keyframes jun-leave {
    0% { transform: none; opacity: 1; }
    30% { transform: translateY(-6%) scale(1.03); }
    100% { transform: translateY(25%) scale(.3); opacity: 0; }
  }

  /* the spot under the pointer glows softly */
  .glow { position: absolute; z-index: 4; pointer-events: none; border-radius: 50%; transform: translate(-50%, -50%) scale(.8);
    background: radial-gradient(closest-side, color-mix(in srgb, var(--glow) 28%, transparent), transparent 85%);
    opacity: 0; transition: opacity .35s ease, transform .35s ease; }
  .glow.on { opacity: .6; transform: translate(-50%, -50%) scale(.9); }

  /* her thinking cloud while she works out a reply */
  .cloud { position: absolute; z-index: 5; pointer-events: none; display: flex; gap: 4px; padding: 7px 10px; border-radius: 16px;
    background: var(--bubble-bg); border: 2px solid var(--edge); transform: translate(-50%, -100%) scale(0); opacity: 0;
    transition: opacity .2s ease, transform .25s cubic-bezier(.2, .9, .3, 1.4); }
  .cloud.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  .cloud::before, .cloud::after { content: ''; position: absolute; border-radius: 50%; background: var(--bubble-bg); border: 2px solid var(--edge); }
  .cloud::before { width: 9px; height: 9px; left: 30%; bottom: -10px; }
  .cloud::after { width: 5px; height: 5px; left: 22%; bottom: -17px; }
  .cloud i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); animation: cloud-dot 1s ease-in-out infinite; }
  .cloud i:nth-child(2) { animation-delay: .15s; } .cloud i:nth-child(3) { animation-delay: .3s; }
  @keyframes cloud-dot { 0%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

  /* picture icons sit in the bubble a bit bigger */
  .emote.pic { font-size: 17px; }

  /* particles: hearts, sparkles, dust */
  .particle { position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%); animation: particle-fly linear forwards; }
  .heart-p { color: var(--accent); font-size: 16px; text-shadow: 0 0 4px rgba(255, 255, 255, .5); }
  .spark-p { color: #fff6c2; font-size: 13px; text-shadow: 0 0 6px var(--glow); }
  .dust-p { color: rgba(190, 180, 170, .7); font-size: 9px; filter: blur(.6px); }
  @keyframes particle-fly {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); }
  }

  /* a hard landing squashes her for a moment */
  #stage.squash { animation: jun-squash .32s ease-out; transform-origin: 50% 100%; }
  @keyframes jun-squash { 0% { transform: scale(1.06, .88); } 55% { transform: scale(.97, 1.04); } 100% { transform: none; } }

  /* her shadow breathes with each step */
  .shadow.walking { animation: shadow-step var(--step, 550ms) ease-in-out infinite alternate; }
  @keyframes shadow-step { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(.85); opacity: .8; } }

  /* adjusting the touch spots */
  .calib { position: absolute; inset: 0; z-index: 20; background: rgba(10, 6, 24, .25); }
  .calib-bar { position: absolute; left: 8px; right: 8px; top: 6px; padding: 8px 10px; font: 600 12.5px/1.35 Arial, Helvetica, sans-serif;
    color: #fff; background: #191233; border-left: 4px solid #ec0054; border-radius: 6px; }
  .calib-bar span { display: flex; gap: 6px; margin-top: 6px; }
  .calib-bar button { border: 0; padding: 5px 10px; border-radius: 5px; font: 800 12px Arial, Helvetica, sans-serif; color: #fff; background: #3a2d6b; cursor: pointer; }
  .calib-bar button[data-do=done] { background: #ec0054; }
  .calib-spot { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; cursor: grab; touch-action: none;
    border: 2px solid #ec0054; background: rgba(236, 0, 84, .18); color: #fff; font: 800 10px Arial, Helvetica, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center; text-shadow: 0 1px 2px #000; min-width: 16px; min-height: 16px; }
  .calib-spot:active { cursor: grabbing; background: rgba(236, 0, 84, .35); }
  /* a pair with its own left and right: dashed, so it's clear they move apart */
  .calib-spot.unlinked { border-style: dashed; border-color: #ffb400; background: rgba(255, 180, 0, .18); }
  .calib-bar label { display: flex; align-items: center; gap: 4px; margin-right: 4px; cursor: pointer; }

  /* a hand left in place (two hands): sits on the spot, clickable to lift */
  .pin { position: absolute; z-index: 9; transform: translate(-50%, -50%); font-size: 26px; cursor: pointer;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .6)); animation: pin-in .25s ease-out; }
  .pin.rubbing { animation: pin-in .25s ease-out, pin-rub .28s ease-in-out .25s infinite alternate; }
  .pin:hover { filter: drop-shadow(0 0 6px var(--glow)); }
  @keyframes pin-in { from { transform: translate(-50%, -80%) scale(.4); opacity: 0; } }
  @keyframes pin-rub { from { transform: translate(-65%, -50%) rotate(-8deg); } to { transform: translate(-35%, -50%) rotate(8deg); } }

  /* feedback at the pointer */
  .ripple { position: absolute; z-index: 7; pointer-events: none; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--accent); transform: translate(-50%, -50%) scale(.3); opacity: .9; animation: ripple .55s ease-out forwards; }
  @keyframes ripple { to { transform: translate(-50%, -50%) scale(1.4); opacity: 0; } }
  .ring { position: absolute; z-index: 7; pointer-events: none; width: 46px; height: 46px; border-radius: 50%;
    transform: translate(-50%, -50%); opacity: 0;
    background: conic-gradient(var(--accent) calc(var(--p, 0) * 1turn), color-mix(in srgb, var(--panel) 70%, transparent) 0);
    -webkit-mask: radial-gradient(circle, transparent 15px, #000 16px); mask: radial-gradient(circle, transparent 15px, #000 16px); }
  @property --p { syntax: '<number>'; inherits: false; initial-value: 0; }
  .ring.on { opacity: 1; animation: ring-fill var(--hold, 450ms) linear forwards; }
  @keyframes ring-fill { from { --p: 0; } to { --p: 1; } }
  .action-label { position: absolute; z-index: 8; pointer-events: none; padding: 3px 9px; border-radius: 10px; white-space: nowrap;
    font: 800 12px Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bubble-bg); border: 1px solid var(--edge); text-shadow: var(--outline);
    transform: translate(-50%, -100%) scale(.8); opacity: 0; }
  .action-label.on { animation: label-pop 1.25s ease forwards; }
  @keyframes label-pop {
    0% { opacity: 0; transform: translate(-50%, -80%) scale(.8); }
    15% { opacity: 1; transform: translate(-50%, -100%) scale(1.05); }
    75% { opacity: 1; transform: translate(-50%, -110%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -130%) scale(1); }
  }

  @keyframes zzz { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(26px, -60px); } }
</style>
</head>
<body>
<div class="tools" id="tools">
  <button type="button" id="toWindow" title="Her window" aria-label="Her window">⤢</button>
  <button type="button" id="toStepout" title="Step out onto the desktop" aria-label="Step out onto the desktop">↘</button>
  <button type="button" id="toHide" title="Hide" aria-label="Hide">–</button>
</div>
<div class="talk" id="talk" hidden>
  <form id="talkForm" autocomplete="off">
    <button type="button" class="grip" id="talkGrip" title="Drag to move" aria-label="Move the chat bar"></button>
    <input id="talkInput" type="text" maxlength="500" placeholder="Say something…" aria-label="Say something">
    <button type="submit">Say</button>
    <button type="button" class="close" id="talkClose" title="Hide (tap her to bring it back)" aria-label="Hide the chat bar">×</button>
  </form>
</div>
<div id="stage"></div>
<div class="shadow" id="shadow" hidden aria-hidden="true"></div>
<div class="emote" id="emote" aria-hidden="true"></div>
<div class="cloud" id="cloud" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="glow" id="glow" aria-hidden="true"></div>
<div class="ring" id="ring" aria-hidden="true"></div>
<div class="action-label" id="actionLabel" aria-hidden="true"></div>
<div class="zzz" id="zzz" hidden aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div>
<div class="note" id="note" hidden></div>

<script defer src="vendor/live2dcubismcore.min.js"></script>
<script defer src="vendor/pixi.min.js"></script>
<script defer src="vendor/pixi-unsafe-eval.min.js"></script>
<script defer src="vendor/cubism4.min.js"></script>
<script type="module" src="js/desktop.js?v=29"></script>
</body>
</html>
