<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debug menu</title>
<link rel="icon" href="favicon.png">
<style>
  /* every color is a variable, so the menu can be recolored like everything else */
  :root { --bg: #120f18; --panel: #1d1827; --ink: #ece6f5; --dim: #a397b5; --edge: #362d46; --accent: #8fe3ff; --warn: #ffb36b; --ok: #6fe0a4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 14px 18px 6px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-family: ui-monospace, monospace; letter-spacing: .04em; }
  header h1::before { content: '> '; color: var(--accent); }
  header p { margin: 0; color: var(--dim); font-size: 12px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 18px 0; }
  nav button.on { border-color: var(--accent); color: var(--accent); }
  main { padding: 12px 18px 40px; }
  section { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  h2 { font-size: 12px; margin: 0 0 8px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .note { margin: 4px 0 8px; color: var(--dim); font-size: 12px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; align-items: center; }
  button, select, input { background: #2a2338; color: var(--ink); border: 1px solid var(--edge); border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 13px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.warn { border-color: #6b4a2b; }
  input[type=search] { width: 100%; }
  input.amt { width: 84px; }
  .test { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--edge); margin-bottom: 10px; }
  .test.on { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); }
  .test b { flex: 1; }
  .grp { margin: 12px 0 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .spawn { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; }
  .spawn:nth-child(odd) { background: color-mix(in srgb, var(--ink) 3%, transparent); }
  .spawn .nm b { font-size: 13px; } .spawn .nm span:not(.tag) { display: block; font-size: 11px; color: var(--dim); }
  .spawn .have { font-size: 12px; color: var(--dim); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--edge); color: var(--dim); margin-left: 6px; }
  #msg { min-height: 1.4em; font-size: 12px; color: var(--ok); margin: 6px 0; }
  #msg.err { color: var(--warn); }
  .recent { font: 12px ui-monospace, monospace; color: var(--dim); margin: 0; padding-left: 16px; }
  .empty { color: var(--dim); font-size: 13px; padding: 8px 0; }
  @media (max-width: 520px) { .spawn { grid-template-columns: 1fr auto; } .spawn .have { display: none; } }
</style>
</head>
<body>
<header>
  <h1>debug menu</h1>
  <p>F12 opens this from any of her windows. Ctrl+Shift+I still opens a window's console straight away.</p>
</header>
<nav id="tabs" aria-label="Debug tools"></nav>
<main id="tool"></main>
<script type="module" src="js/debug-menu.js?v=2"></script>
</body>
</html>
